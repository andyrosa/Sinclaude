<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinclaude Sinclair Simulator</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32">
    <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- The cb query strings hold a placeholder that .github/workflows/deploy.yml replaces with
         the commit id, so a deploy invalidates browser caches while an unchanged build stays
         cached. Local copies keep the placeholder. -->
    <link rel="stylesheet" href="styles.css?cb=__BUILD__">
    <script src="constants_and_css_vars.js?cb=__BUILD__"></script>
    <script src="console-utils.js?cb=__BUILD__"></script>
    <script src="ui.js?cb=__BUILD__"></script>
</head>

<body>
    <div class="top-row">
        <div class="section assembly-section">
            <h3 id="assembly-section-title">1. Assembly Code Input</h3>
            <div class="section-content">
                <div class="section-main section-main-flex">
                    <div id="assemblyEditor" class="assembly-editor">
                        <div class="assembly-columns">
                            <div id="addressColumn" class="address-column"></div>
                            <div id="opcodesColumn" class="opcodes-column"></div>
                            <div id="assemblyColumn" class="assembly-column" contenteditable="true"
                                 spellcheck="false"
                                 data-placeholder="Type or paste your Z80 assembly code here..."></div>
                        </div>
                    </div>
                </div>
                <div class="section-controls">
                    <div class="controls">
                        <button type="button" class="clear-btn" onclick="sinclaude.clearAssembly()" title="Clear the assembly editor">Clear</button>
                        <button type="button" class="load-btn" onclick="sinclaude.loadCharacterSetAssembly()" title="Display all 256 character codes and numbered graphics fill patterns">Load Character Set Test</button>
                        <button type="button" class="load-btn" onclick="sinclaude.loadBasicsAssembly()" title="Test single-stepping, registers, flags and the stack - starts halted">Load Debugger Test</button>
                        <button type="button" class="load-btn" onclick="sinclaude.loadPerformanceAssembly()" title="Increment a hexadecimal counter approximately every four million Z80 T-states">Load Performance Test</button>
                        <button type="button" class="load-btn" onclick="sinclaude.loadSpaceInvaderAssembly()" title="Load a playable Space Invader micro-game">Load 'Space Invader'</button>
                        <button type="button" class="load-btn" onclick="sinclaude.loadClaudasaurAssembly()" title="Find the exit in a first-person maze before the spiky Claudasaur catches you. W/S move, A/D turn, Space starts or shows the map, P pauses.">Load 'Claudasaur'</button>
                        <!-- Narrow screens show this select instead of the load buttons above -->
                        <select class="load-select" aria-label="Load a program" onchange="sinclaude.loadProgramFromSelect(this)">
                            <option value="" disabled selected hidden>Load a program...</option>
                            <option value="characterSet">Character Set Test</option>
                            <option value="basics">Debugger Test</option>
                            <option value="performance">Performance Test</option>
                            <option value="spaceInvader">'Space Invader'</option>
                            <option value="claudasaur">'Claudasaur'</option>
                        </select>
                        <button type="button" id="assemble-run-btn" class="important-button" onclick="sinclaude.assembleAndRun()" title="Compile the Z80 assembly code and start execution">Assemble and Run</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="section listing-section">
            <h3 title="Click to collapse/expand section">2. Magazine Listing
                <button type="button" class="header-item" onclick="event.stopPropagation(); window.sinclaude.expandElement('machineCode')" title="Expand Magazine Listing">⤢</button>
                <button type="button" class="header-item" onclick="event.stopPropagation(); copyMagazineListingToClipboard()" title="Copy Magazine Listing to clipboard">📋</button>
            </h3>
            <div class="section-content">
                <div class="section-main">
                    <div id="machineCode"></div>
                </div>
            </div>
        </div>
        <div class="header-items">
            <button type="button" class="header-item" onpointerdown="expandAssemblyTextarea()" title="Expand Editor">⤢</button>
            <button type="button" class="header-item" onclick="toggleMenu()" title="Menu">🍔</button>
            <div class="menu-dropdown" id="menuDropdown">
                <a href="#" onclick="showAbout(); return false;" class="menu-item">About</a>
                <a href="https://andyrosa.github.io/Sinclaude/" target="_blank" rel="noopener" class="menu-item" onclick="closeMenu();">Docs</a>
                <a href="https://github.com/andyrosa/Sinclaude" target="_blank" rel="noopener" class="menu-item" onclick="closeMenu();">Repo</a>
                <a href="#" onclick="toggleRetroFontsFromMenu(); return false;" class="menu-item" id="retroFontsToggle">✓ Retro Fonts</a>
            </div>
        </div>
    </div>

    <div class="section console-section">
        <h3 title="Click to collapse/expand section">3. Console Output 
            <button type="button" class="header-item" onclick="event.stopPropagation(); window.sinclaude.expandElement('console')" title="Expand Console Output">⤢</button>
        </h3>
        <div class="section-content">
            <div class="section-main">
                <div id="console"></div>
            </div>
            <div class="section-controls">
                <div class="controls">
                    <button type="button" onclick="clearConsole()" title="Clear the console output">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="section execution-section">
        <h3>4. Execution</h3>
        <div class="section-content">
            <div class="screen-container">
                <div id="screen"></div>
                <div id="audioStartPrompt" class="audio-start-prompt" role="group" aria-label="Start execution" hidden>
                    <p id="audioStartMessage" aria-live="polite">Click or press a key to start with sound</p>
                    <button type="button" id="startWithSound">Start with sound</button>
                    <button type="button" id="startMuted">Start muted</button>
                </div>
            </div>
            <div class="execution-controls">
                <div class="controls game-buttons" id="gameButtons">
                    <!-- Buttons generated by JavaScript -->
                </div>
                <div class="button-caption-edit-toggle" onclick="sinclaude.toggleButtonCaptionEdit()"></div>
                <div class="controls" id="executionControls">
                    <!-- Dynamic buttons will be rendered here based on state -->
                </div>
                <div class="debug">
                    <div>PC: <span id="regPC">-</span></div>
                    <div>Op Code: <span id="currentInstruction">-</span></div>
                    <div>SP: <span id="regSP">-</span></div>
                    <div>Stack: <span id="stackContents">---- ----</span></div>
                    <div>A: <span id="regA">-</span></div>
                    <div>Zero: <span id="flagZ">-</span></div>
                    <div>Carry: <span id="flagC">-</span></div>
                    <div>BC: <span id="regBC">-</span></div>
                    <div>DE: <span id="regDE">-</span></div>
                    <div>HL: <span id="regHL">-</span></div>
                    <div>I/O Ports: <span id="ports">-</span></div>
                    <div>MIPS: <span id="mips">-</span></div>
                    <div>Frame Rate Hz: <span id="refreshRate">-</span></div>
                    <div>Key: <span id="keyCodeCurrent">-</span></div>
                </div>
                <div id="keyboardStatus" class="keyboard-status"></div>
            </div>
        </div>
    </div>

    <!-- Loads the remaining scripts; placed after the console element so load errors can be shown in it -->
    <script src="boot.js?cb=__BUILD__"></script>
</body>

</html>
